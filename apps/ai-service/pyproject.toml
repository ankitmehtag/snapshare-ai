[project]
name = "snapshare-ai-service"
version = "0.1.0"
description = "SnapShare AI inference service (FastAPI). Internal only — see docs/AI_ARCHITECTURE.md."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.1",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.0",
    "pip-audit>=2.9",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.uv]
# An application, not a distributable package.
package = false
# Supply-chain cooldown: never resolve a release younger than 7 days.
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]
