<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SnapShare — private, consent-first photo sharing for weddings and events. Guests find their own photos in minutes."
    />
    <meta name="theme-color" content="#4338ca" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SnapShare — every guest gets their photos</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('snapshare-ui') || '{}').state?.theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SnapShare needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
