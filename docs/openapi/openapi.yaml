openapi: 3.1.0
info:
  title: SnapShare AI API
  version: 0.1.0
  summary: Core endpoints skeleton (Phase 0). Full spec is generated from Zod from Phase 1.
  description: |
    Skeleton contract for the most critical flows. Authoritative endpoint list: docs/API_SPEC.md.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.snapshare.in/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local
tags:
  - name: auth
    description: Authentication and sessions
  - name: studios
    description: Studio tenants
  - name: events
    description: Events, albums, photos
  - name: uploads
    description: Direct-to-storage upload sessions
  - name: public
    description: Guest gallery access
  - name: billing
    description: Subscriptions and webhooks

security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Logged in. Sets `at`, `rt` and `csrf` cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate refresh token and issue new access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Rotated. New cookies set. }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke current session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Problem' }

  /studios/{studioId}/events:
    parameters:
      - $ref: '#/components/parameters/StudioId'
    get:
      tags: [events]
      operationId: listEvents
      summary: List events (requires event.read)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  page: { $ref: '#/components/schemas/Page' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [events]
      operationId: createEvent
      summary: Create event (requires event.create; entitlement limits.activeEvents)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /studios/{studioId}/upload-sessions:
    parameters:
      - $ref: '#/components/parameters/StudioId'
    post:
      tags: [uploads]
      operationId: createStudioUploadSession
      summary: Create upload session with file manifest (dedupe + quota check)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, files]
              properties:
                target:
                  type: object
                  required: [eventId]
                  properties:
                    eventId: { $ref: '#/components/schemas/ObjectId' }
                    albumId: { $ref: '#/components/schemas/ObjectId' }
                files:
                  type: array
                  maxItems: 2000
                  items: { $ref: '#/components/schemas/UploadFileManifest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /studios/{studioId}/upload-sessions/{sessionId}/files/{fileId}/parts:
    parameters:
      - $ref: '#/components/parameters/StudioId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [uploads]
      operationId: presignUploadParts
      summary: Get presigned URLs for parts (or a single PUT for small files)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partNumbers:
                  type: array
                  maxItems: 100
                  items: { type: integer, minimum: 1, maximum: 10000 }
                single: { type: boolean }
      responses:
        '200':
          description: Presigned URLs (valid 15 minutes)
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      required: [partNumber, url]
                      properties:
                        partNumber: { type: integer }
                        url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }

  /studios/{studioId}/upload-sessions/{sessionId}/files/{fileId}/complete:
    parameters:
      - $ref: '#/components/parameters/StudioId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/FileId'
    post:
      tags: [uploads]
      operationId: completeUploadFile
      summary: Complete multipart upload; creates photo and enqueues processing (idempotent)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                type: object
                required: [photoId, status]
                properties:
                  photoId: { $ref: '#/components/schemas/ObjectId' }
                  status: { type: string, enum: [uploaded, duplicate] }
        '409': { $ref: '#/components/responses/Problem' }

  /public/galleries/{code}:
    parameters:
      - $ref: '#/components/parameters/ShareCode'
    get:
      tags: [public]
      operationId: getPublicGallery
      summary: Resolve share link (no token required)
      security: []
      responses:
        '200':
          description: Gallery metadata and access requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGallery' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /public/galleries/{code}/photos:
    parameters:
      - $ref: '#/components/parameters/ShareCode'
    get:
      tags: [public]
      operationId: listPublicPhotos
      summary: List gallery photos with signed delivery URLs
      security:
        - galleryCookie: []
      parameters:
        - name: albumId
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicPhoto' }
                  page: { $ref: '#/components/schemas/Page' }
        '401': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /public/galleries/{code}/face-searches:
    parameters:
      - $ref: '#/components/parameters/ShareCode'
    post:
      tags: [public]
      operationId: createFaceSearch
      summary: Queue a selfie face search (async; requires active consent)
      security:
        - galleryCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selfieKey]
              properties:
                selfieKey: { type: string, pattern: '^tmp/selfies/[A-Za-z0-9-]+\.(jpg|png|webp)$' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { $ref: '#/components/schemas/ObjectId' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /public/galleries/{code}/face-searches/{jobId}:
    parameters:
      - $ref: '#/components/parameters/ShareCode'
      - name: jobId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ObjectId' }
    get:
      tags: [public]
      operationId: getFaceSearch
      summary: Face search status and results (confidence bands only, never raw scores)
      security:
        - galleryCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [queued, running, succeeded, failed] }
                  results:
                    type: array
                    items:
                      type: object
                      required: [photo, confidence]
                      properties:
                        photo: { $ref: '#/components/schemas/PublicPhoto' }
                        confidence: { type: string, enum: [high, medium] }
        '404': { $ref: '#/components/responses/Problem' }

  /webhooks/razorpay:
    post:
      tags: [billing]
      operationId: razorpayWebhook
      summary: Razorpay webhook (signature verified on raw body)
      security: []
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Accepted (idempotent) }
        '400': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: at
      description: Access JWT (10 min). Non-GET requests also require X-CSRF-Token.
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt
    galleryCookie:
      type: apiKey
      in: cookie
      name: gt
      description: Gallery access JWT scoped to one share link.

  parameters:
    StudioId:
      name: studioId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    ShareCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9]{10,32}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
    Page:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
        meta: { type: object }
    Workspace:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [personal, studio] }
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        slug: { type: string }
        role: { type: string }
    MeResponse:
      type: object
      required: [id, email, name, workspaces]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        email: { type: string, format: email }
        name: { type: string }
        emailVerified: { type: boolean }
        platformRole: { type: string, enum: [none, support, admin] }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }
    EventCreate:
      type: object
      required: [name, type, startsAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [wedding, corporate, birthday, festival, other] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        venue: { type: string, maxLength: 200 }
        albums:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 80 }
        aiEnabled: { type: boolean, default: false }
    Event:
      type: object
      required: [id, name, type, status, startsAt, counts]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        startsAt: { type: string, format: date-time }
        venue: { type: string }
        coverUrl: { type: [string, 'null'], format: uri }
        aiEnabled: { type: boolean }
        counts:
          type: object
          properties:
            photos: { type: integer }
            processed: { type: integer }
            failed: { type: integer }
            bytes: { type: integer }
    UploadFileManifest:
      type: object
      required: [clientFileId, name, size, mime, sha256]
      properties:
        clientFileId: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 1 }
        mime: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, image/heif, video/mp4, video/quicktime] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        relativePath: { type: string, maxLength: 1024 }
    UploadSession:
      type: object
      required: [id, files]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        expiresAt: { type: string, format: date-time }
        files:
          type: array
          items:
            type: object
            required: [fileId, clientFileId, status]
            properties:
              fileId: { $ref: '#/components/schemas/ObjectId' }
              clientFileId: { type: string }
              status: { type: string, enum: [new, duplicate, rejected] }
              reason: { type: string }
              partSize: { type: integer }
              totalParts: { type: integer }
    PublicGallery:
      type: object
      required: [code, eventName, status, requires]
      properties:
        code: { type: string }
        eventName: { type: string }
        studio:
          type: object
          properties:
            name: { type: string }
            logoUrl: { type: [string, 'null'], format: uri }
            primaryColor: { type: string }
            showSnapshareBadge: { type: boolean }
        coverUrl: { type: [string, 'null'], format: uri }
        status: { type: string, enum: [active, expired, suspended] }
        requires:
          type: object
          properties:
            pin: { type: boolean }
            otp: { type: boolean }
        features:
          type: object
          properties:
            faceSearch: { type: boolean }
            download: { type: boolean }
            favorites: { type: boolean }
    PublicPhoto:
      type: object
      required: [id, width, height, urls]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        width: { type: integer }
        height: { type: integer }
        takenAt: { type: [string, 'null'], format: date-time }
        urls:
          type: object
          required: [thumb, preview]
          properties:
            thumb: { type: string, format: uri }
            preview: { type: string, format: uri }
            web: { type: string, format: uri }
