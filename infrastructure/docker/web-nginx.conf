# SPA server for the web image. TLS, rate limits and the /api proxy live in the edge
# nginx (infrastructure/nginx, Phase 10); this only serves static files.
#
# All headers are set once at server level: an add_header inside a location would
# silently drop every server-level header (nginx inheritance rule).

# Vite emits content-hashed files under /assets: cache forever. index.html and client
# routes must always revalidate so a deploy is picked up immediately.
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
