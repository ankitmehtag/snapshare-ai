# Local Prometheus (compose profile `monitoring`). Production scrape config and alert
# rules arrive with the Phase 10 hardening (INFRASTRUCTURE §7).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # api on the host (pnpm dev): internal metrics port, never routed publicly.
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:9464']

  # ai-service (compose profile `ai`). Down targets are harmless when the profile is off.
  - job_name: ai-service
    static_configs:
      - targets: ['ai-service:8000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
